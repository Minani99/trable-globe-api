spring:
  application:
    name: trable-globe-api
  profiles:
    # "local" boots on an in-memory H2 database so the API runs with zero setup.
    # Use "postgres" against a real PostgreSQL instance, "prod" for deployment.
    default: local
    # The hosted showcase uses production infrastructure plus explicit demo data.
    # A real user-facing deployment activates only "prod" and never seeds records.
    group:
      demo: prod
  jpa:
    # DTOs are assembled inside transactional services, so the view layer never
    # triggers lazy loading. Keeping this off makes N+1 problems fail loudly.
    open-in-view: false

server:
  # Render, Fly, Heroku and Cloud Run all inject PORT and route only to that port. Honour
  # it first so the app binds where the platform is listening without extra configuration;
  # SERVER_PORT stays available as an explicit override.
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

travel-globe:
  cors:
    allowed-origins: http://localhost:3000
  auth:
    # Opaque sessions are persisted so a user can log out from one device immediately.
    # The browser keeps only the raw token in an HttpOnly cookie owned by Next.js.
    session-days: ${AUTH_SESSION_DAYS:30}
    expose-action-tokens: false
  mail:
    public-base-url: ${PUBLIC_SITE_URL:http://localhost:3000}
    from: ${MAIL_FROM:Travel Globe <no-reply@travel-globe.local>}
  seed:
    enabled: false

logging:
  level:
    com.travelglobe.trableglobeapi: INFO
