# Deployment profile.
#
# Every value comes from the environment - nothing secret is committed. The
# application fails fast at startup if a required variable is missing.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

travel-globe:
  cors:
    # Comma-separated list of the deployed frontend origins.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  seed:
    # Never fabricate travel data in production.
    enabled: false

logging:
  level:
    root: INFO
    com.travelglobe.trableglobeapi: INFO
