# Deployment profile.
#
# Every value comes from the environment - nothing secret is committed. The
# application fails fast at startup if a required variable is missing.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Keep the pool deliberately small for a single Render instance. Scale the
      # database connection budget before increasing this or adding instances.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:3000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:60000}
      # Let idle Neon compute suspend; Hikari's background validation pings
      # would otherwise keep consuming DB compute hours without user traffic.
      keepalive-time: ${DB_KEEPALIVE_TIME_MS:0}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1500000}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

travel-globe:
  cors:
    # Comma-separated list of the deployed frontend origins.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  seed:
    # Off by default so a fresh deployment never invents data on its own.
    #
    # The live deployment overrides this with TRAVEL_GLOBE_SEED_ENABLED=true, on purpose:
    # the landing page links to @traveler as the sample world, so removing it leaves the
    # front door pointing at a 404. That account is the only fabricated one, it is created
    # once and skipped on every later start, and it must never be treated as a real member.
    enabled: false

logging:
  level:
    root: INFO
    com.travelglobe.trableglobeapi: INFO
