name: Production smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

jobs:
  probe:
    name: Public service probes
    if: ${{ vars.PRODUCTION_SITE_URL != '' && vars.PRODUCTION_API_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}
      API_URL: ${{ vars.PRODUCTION_API_URL }}
    steps:
      - name: Check backend readiness
        run: curl --fail --show-error --silent --retry 3 --retry-all-errors --max-time 30 "$API_URL/api/health"
      - name: Check backend liveness
        run: curl --fail --show-error --silent --retry 3 --retry-all-errors --max-time 30 "$API_URL/api/health/live"
      - name: Check frontend and same-origin API proxy
        run: |
          curl --fail --show-error --silent --retry 3 --retry-all-errors --max-time 30 "$SITE_URL/" > /dev/null
          curl --fail --show-error --silent --retry 3 --retry-all-errors --max-time 30 "$SITE_URL/api/health" > /dev/null
