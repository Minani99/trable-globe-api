# Keeps the free Render instance from sleeping during Korean waking hours.
#
# A free web service sleeps after ~15 minutes of silence and the next visitor pays
# a 50-second wake-up. This pings the health endpoint often enough that the timer
# never expires. See docs/operations.md for the hour budget this spends.
#
# Delete this workflow once the service is on a paid plan - it stops sleeping then,
# and this only burns the free hour budget.
name: keep-awake

on:
  schedule:
    # Every 5 minutes, but only 22:00-15:59 UTC = 07:00-00:59 KST.
    # The gap (16:00-21:59 UTC = 01:00-06:59 KST) lets the instance sleep overnight,
    # which is what keeps the monthly hour budget comfortable rather than marginal.
    #
    # Five minutes, not ten: GitHub's scheduler is best-effort and routinely runs
    # late under load, so the interval has to stay well under the 15-minute timer.
    - cron: "*/5 0-15,22,23 * * *"
  workflow_dispatch:

# A late run must never pile up behind the next one.
concurrency:
  group: keep-awake
  cancel-in-progress: true

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the API and verify it is healthy
        env:
          # Repository variable, so the URL is not pinned inside the workflow.
          # Settings > Secrets and variables > Actions > Variables > HEALTH_URL
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          set -euo pipefail
          url="${HEALTH_URL:-https://travel-globe-api-cexs.onrender.com/api/health}"

          # A sleeping instance answers slowly, so allow a full cold start before
          # calling it a failure. Retry to ride out a restart or a brief blip.
          for attempt in 1 2 3; do
            echo "attempt $attempt: GET $url"
            if body="$(curl --fail --show-error --silent --location \
                            --max-time 90 --retry 0 "$url")"; then
              echo "$body"
              case "$body" in
                *'"status":"UP"'*)
                  echo "healthy"
                  exit 0
                  ;;
                *)
                  echo "::warning::reachable but not reporting UP"
                  ;;
              esac
            fi
            [ "$attempt" -lt 3 ] && sleep 20
          done

          echo "::error::health check failed after 3 attempts"
          exit 1
