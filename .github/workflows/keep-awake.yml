# Manual incident check of DB readiness and the public profile.
# Cloudflare owns five-minute process-only pings. Production smoke provides
# sparse end-to-end checks; recurring DB pings consume Neon's free compute quota.
name: keep-awake

on:
  # Cloudflare owns the recurring ping. Keep this as a manual recovery tool only.
  workflow_dispatch:

# A late run must never pile up behind the next one.
concurrency:
  group: keep-awake
  cancel-in-progress: true

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wake the API and verify it is healthy
        env:
          # Repository variable, so the URL is not pinned inside the workflow.
          # Settings > Secrets and variables > Actions > Variables > API_BASE_URL
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          SAMPLE_PROFILE: ${{ vars.SAMPLE_PROFILE }}
        run: |
          set -euo pipefail
          base="${API_BASE_URL:-https://travel-globe-api-cexs.onrender.com}"
          base="${base%/}"
          profile="${SAMPLE_PROFILE:-traveler}"

          # A sleeping instance answers slowly, so allow a full cold start before calling
          # it a failure, and retry to ride out a restart or a brief blip.
          fetch_ok() {
            local url="$1" expect="$2" attempt body
            for attempt in 1 2 3; do
              if body="$(curl --fail --show-error --silent --location --max-time 90 "$url")"; then
                case "$body" in
                  *"$expect"*) printf '%s' "$body"; return 0 ;;
                  *) echo "::warning::$url answered without '$expect'" >&2 ;;
                esac
              fi
              [ "$attempt" -lt 3 ] && sleep 20
            done
            return 1
          }

          echo "checking readiness"
          if ! fetch_ok "$base/api/health" '"status":"UP"' >/dev/null; then
            echo "::error::health check failed - the API is down or the database is unreachable"
            exit 1
          fi

          # Readiness only proves the process is up. This is the check that catches a
          # deployment that boots fine but can no longer serve anyone: it reads the
          # sample profile the landing page links to, through the same public endpoint a
          # visitor uses.
          echo "checking the sample profile still loads"
          if ! fetch_ok "$base/api/profiles/$profile" '"username"' >/dev/null; then
            echo "::error::the API is up but /api/profiles/$profile is not serving a profile"
            exit 1
          fi

          echo "healthy"
