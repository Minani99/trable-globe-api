# Keeps the free Render instance awake, and doubles as the beta's alarm.
#
# A free web service sleeps after ~15 minutes and the next visitor pays a 50-second
# wake-up. This pings often enough that the timer never expires. See docs/operations.md
# for the hour budget it spends.
#
# It also checks that the API still answers correctly, not just that it answers at all.
# Nothing else watches production: request failures are logged on Render and read by
# nobody, so a failing run here - which GitHub emails the repository owner about - is the
# only thing standing between a broken deployment and a friend reporting it.
#
# Delete this workflow once the service is on a paid plan and a real error tracker is
# wired up; keeping it then only burns the free hour budget.
name: keep-awake

on:
  schedule:
    # Every 5 minutes, but only 22:00-15:59 UTC = 07:00-00:59 KST.
    # The gap (16:00-21:59 UTC = 01:00-06:59 KST) lets the instance sleep overnight,
    # which is what keeps the monthly hour budget comfortable rather than marginal.
    #
    # Five minutes, not ten: GitHub's scheduler is best-effort and routinely runs late
    # under load, so the interval has to stay well under the 15-minute timer.
    - cron: "*/5 0-15,22,23 * * *"
  workflow_dispatch:

# A late run must never pile up behind the next one.
concurrency:
  group: keep-awake
  cancel-in-progress: true

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wake the API and verify it is healthy
        env:
          # Repository variable, so the URL is not pinned inside the workflow.
          # Settings > Secrets and variables > Actions > Variables > API_BASE_URL
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          SAMPLE_PROFILE: ${{ vars.SAMPLE_PROFILE }}
        run: |
          set -euo pipefail
          base="${API_BASE_URL:-https://travel-globe-api-cexs.onrender.com}"
          base="${base%/}"
          profile="${SAMPLE_PROFILE:-traveler}"

          # A sleeping instance answers slowly, so allow a full cold start before calling
          # it a failure, and retry to ride out a restart or a brief blip.
          fetch_ok() {
            local url="$1" expect="$2" attempt body
            for attempt in 1 2 3; do
              if body="$(curl --fail --show-error --silent --location --max-time 90 "$url")"; then
                case "$body" in
                  *"$expect"*) printf '%s' "$body"; return 0 ;;
                  *) echo "::warning::$url answered without '$expect'" >&2 ;;
                esac
              fi
              [ "$attempt" -lt 3 ] && sleep 20
            done
            return 1
          }

          echo "checking readiness"
          if ! fetch_ok "$base/api/health" '"status":"UP"' >/dev/null; then
            echo "::error::health check failed - the API is down or the database is unreachable"
            exit 1
          fi

          # Readiness only proves the process is up. This is the check that catches a
          # deployment that boots fine but can no longer serve anyone: it reads the
          # sample profile the landing page links to, through the same public endpoint a
          # visitor uses.
          echo "checking the sample profile still loads"
          if ! fetch_ok "$base/api/profiles/$profile" '"username"' >/dev/null; then
            echo "::error::the API is up but /api/profiles/$profile is not serving a profile"
            exit 1
          fi

          echo "healthy"
